[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typesafe-skill-router"
version = "1.1.0"
description = "TypeSafe (Jev) or local Laya skill routing for Hermes Agent."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ritesh Patel", email = "60716910+DECRUX9812@users.noreply.github.com" }]
keywords = ["hermes", "plugin", "typesafe", "laya", "routing", "skills"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[tool.setuptools]
packages = ["typesafe_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The plugin directory itself is a package (Hermes imports it as one), so the tests are
# loaded in importlib mode with explicit paths instead of pytest's sys.path dance.
addopts = "-q --import-mode=importlib"
pythonpath = [".", "tests"]
